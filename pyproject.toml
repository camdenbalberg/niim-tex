[project]
name = "niim-tex"
version = "0.2.0"
description = "LaTeX-to-NIIMBOT label print pipeline with multi-device BLE support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.scripts]
niim-tex = "niim_tex.cli:main"
niim-mosaic = "niim_tex.mosaic:main"

[tool.setuptools.packages.find]
include = ["niim_tex*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
